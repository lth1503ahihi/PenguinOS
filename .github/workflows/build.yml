name: PenguinOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Tên người build'
        required: false
      builder_id:
        description: 'ID người build'
        required: false
      
jobs:
  Initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt-get -y autoremove --purge || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
          sudo apt-get -y autoclean || true
          sudo apt-get clean || true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up Time
        run: |
          echo "Setting Vienam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          
      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh
        
      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Pack ROM...
        run: |
          sudo bash packROM.sh

      - name: Setup Rclone...
        run: |
          cat << 'EOF' > rclone.conf
          ${{ secrets.RCLONE_DRIVE_CONFIG }}
          EOF
          
      - name: Upload ROM...
        run: |
          sudo -E bash uploadROM.sh
